name: "Reusable - Python Service Build & Deploy"

on:
  workflow_call:
    inputs:
      service_name:
        description: "Name of the service (e.g. flag-service)"
        required: true
        type: string
    secrets:
      OCI_REGION:
        required: true
      OCI_AUTH_TOKEN:
        required: true
      OCI_TENANCY_NAMESPACE:
        required: true
      OCI_USERNAME:
        required: true

jobs:
  lint-and-test:
    name: "Lint & Unit Test"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd ${{ inputs.service_name }}
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Python Lint
        run: |
          cd ${{ inputs.service_name }}
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  security-scan:
    name: "Security Scan (SAST & SCA)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Bandit (SAST)
        run: |
          pip install bandit
          bandit -r ${{ inputs.service_name }}/

      - name: Run Trivy (SCA - Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "./${{ inputs.service_name }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"

  build-and-push:
    name: "Build & Push Image"
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to OCIR
        run: |
          echo "${{ secrets.OCI_AUTH_TOKEN }}" | docker login ${{ secrets.OCI_REGION }}.ocir.io -u "${{ secrets.OCI_TENANCY_NAMESPACE }}/${{ secrets.OCI_USERNAME }}" --password-stdin

      - name: Build and Scan Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ inputs.service_name }}/Dockerfile
          platforms: linux/arm64
          push: false
          tags: ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_TENANCY_NAMESPACE }}/togglemaster/${{ inputs.service_name }}:${{ github.sha }}
          load: true

      - name: Run Trivy (Container Scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_TENANCY_NAMESPACE }}/togglemaster/${{ inputs.service_name }}:${{ github.sha }}
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"

      - name: Push Image
        run: |
          IMAGE="${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_TENANCY_NAMESPACE }}/togglemaster/${{ inputs.service_name }}"
          TAG="${{ github.sha }}"
          docker push ${IMAGE}:${TAG}
          docker tag ${IMAGE}:${TAG} ${IMAGE}:latest
          docker push ${IMAGE}:latest

  update-gitops:
    name: "Update GitOps Repo"
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Image Tag
        run: |
          IMAGE="${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_TENANCY_NAMESPACE }}/togglemaster/${{ inputs.service_name }}:${{ github.sha }}"
          sed -i "s|image:.*${{ inputs.service_name }}:.*|image: ${IMAGE}|g" ${{ inputs.service_name }}/k8s/deployment.yaml

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ inputs.service_name }}/k8s/deployment.yaml
          git commit -m "chore(gitops): update ${{ inputs.service_name }} image to ${{ github.sha }}"
          git push origin main
