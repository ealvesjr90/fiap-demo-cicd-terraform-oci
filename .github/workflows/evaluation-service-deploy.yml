name: "Evaluation Service - Build & Deploy"

on:
  push:
    branches: [main]
    paths:
      - "evaluation-service/**"
  pull_request:
    branches: [main]
    paths:
      - "evaluation-service/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    uses: ./.github/workflows/reusable-go-service.yml
    with:
      service_name: evaluation-service
      go_version: '1.25'
    secrets:
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_AUTH_TOKEN: ${{ secrets.OCI_AUTH_TOKEN }}
      OCI_TENANCY_NAMESPACE: ${{ secrets.OCI_TENANCY_NAMESPACE }}
      OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
