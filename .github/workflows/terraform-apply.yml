name: "Terraform Apply"

on:
  workflow_dispatch:

env:
  TF_VERSION: "latest"
  WORKING_DIR: "./terraform"

jobs:
  terraform-apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup OCI Credentials
        uses: ./.github/actions/setup-oci-credentials
        with:
          oci_user_ocid: ${{ secrets.OCI_USER_OCID }}
          oci_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          oci_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          oci_region: ${{ secrets.OCI_REGION }}
          oci_private_key: ${{ secrets.OCI_PRIVATE_KEY }}
          install_oci_cli: "true"

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_compartment_id: ${{ secrets.OCI_COMPARTMENT_ID }}
        run: terraform plan -var-file=envs/dev.tfvars -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Terraform Output
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform output -json > outputs.json

      - name: Upload Outputs
        uses: actions/upload-artifact@v5
        with:
          name: terraform-outputs
          path: terraform/outputs.json

      - name: Notify Success
        if: success()
        run: |
          echo "Terraform Apply completed successfully!"
          echo "Check outputs artifact for resource details"
