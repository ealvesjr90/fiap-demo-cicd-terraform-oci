name: "Reusable: Build & Push to OCIR"

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      container_scan:
        required: false
        type: boolean
        default: false
      copy_shared_python:
        required: false
        type: boolean
        default: false

jobs:
  build-and-push:
    name: "Build & Push Image"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy shared Python utilities
        if: ${{ inputs.copy_shared_python }}
        run: cp -r shared/python/solidarytech ${{ inputs.service_name }}/solidarytech

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to OCIR
        run: |
          echo "${{ secrets.OCI_AUTH_TOKEN }}" | docker login ${{ secrets.OCI_REGION }}.ocir.io -u "${{ secrets.OCI_TENANCY_NAMESPACE }}/${{ secrets.OCI_USERNAME }}" --password-stdin

      - name: Build and Push Image
        if: ${{ !inputs.container_scan }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ inputs.service_name }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_TENANCY_NAMESPACE }}/togglemaster/${{ inputs.service_name }}:${{ github.sha }}
            ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_TENANCY_NAMESPACE }}/togglemaster/${{ inputs.service_name }}:latest

      - name: Build Image (with scan)
        if: ${{ inputs.container_scan }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ inputs.service_name }}
          platforms: linux/arm64
          push: false
          tags: ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_TENANCY_NAMESPACE }}/togglemaster/${{ inputs.service_name }}:${{ github.sha }}
          load: true

      - name: Run Trivy (Container Scan)
        if: ${{ inputs.container_scan }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_TENANCY_NAMESPACE }}/togglemaster/${{ inputs.service_name }}:${{ github.sha }}
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"

      - name: Push Image (after scan)
        if: ${{ inputs.container_scan }}
        run: |
          IMAGE="${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_TENANCY_NAMESPACE }}/togglemaster/${{ inputs.service_name }}"
          TAG="${{ github.sha }}"
          docker push ${IMAGE}:${TAG}
          docker tag ${IMAGE}:${TAG} ${IMAGE}:latest
          docker push ${IMAGE}:latest
