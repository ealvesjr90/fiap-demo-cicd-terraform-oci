name: "Volunteer Service - Build & Deploy"

on:
  push:
    branches: [main]
    paths: ["volunteer-service/**"]
  pull_request:
    branches: [main]
    paths: ["volunteer-service/**"]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/_ci-python.yml
    with:
      service_name: volunteer-service

  build:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_build-push-ocir.yml
    with:
      service_name: volunteer-service
      copy_shared_python: true
    secrets: inherit

  deploy:
    needs: build
    uses: ./.github/workflows/_deploy-oke.yml
    with:
      service_name: volunteer-service
      deploy_infra: true
    secrets: inherit
